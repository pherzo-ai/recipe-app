<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe — Mise</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="recipe-page">

  <!-- Navigation -->
  <nav class="nav" role="navigation">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <span class="logo-icon">🍳</span>
        Mise
      </a>
      <div class="nav-links">
        <a href="saved.html" class="nav-link">Saved Recipes</a>
      </div>
    </div>
  </nav>

  <!-- Secondary action bar -->
  <div class="recipe-header-bar" id="actionBar">
    <div class="recipe-header-inner">
      <a href="javascript:history.back()" class="nav-back">
        ← Back
      </a>
      <div style="display:flex;gap:.5rem;align-items:center;">
        <button class="btn btn-primary" id="saveBtn" style="min-width:140px;">
          Save Recipe
        </button>
      </div>
    </div>
  </div>

  <!-- Recipe content -->
  <main class="recipe-content" id="recipeContent">
    <!-- Populated by JS -->
  </main>

  <!-- Loading overlay (shown while fetching saved recipe by ID) -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <p class="loading-text">Loading recipe…</p>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    /* ── Utilities ──────────────────────────────────────────────────────── */
    let toastTimer;
    function showToast(msg, type = '') {
      clearTimeout(toastTimer);
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show' + (type ? ' ' + type : '');
      toastTimer = setTimeout(() => { el.className = 'toast'; }, 3500);
    }

    function esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /* ── Render helpers ─────────────────────────────────────────────────── */
    function buildMetaChip(label, value) {
      if (!value) return '';
      return `
        <div class="meta-chip">
          <span class="meta-chip-label">${esc(label)}</span>
          <span class="meta-chip-value">${esc(value)}</span>
        </div>`;
    }

    function buildIngredients(ingredients) {
      if (!ingredients || !ingredients.length) return '<p style="color:var(--text-muted);font-size:.9rem;">No ingredients found.</p>';
      return `
        <ul class="ingredients-list" id="ingredientsList">
          ${ingredients.map((ing, i) => `
            <li class="ingredient-item" data-index="${i}" onclick="toggleIngredient(${i})">
              <input type="checkbox" id="ing-${i}" aria-label="${esc(ing)}" tabindex="-1">
              <label class="ingredient-text" for="ing-${i}">${esc(ing)}</label>
            </li>
          `).join('')}
        </ul>`;
    }

    function buildInstructions(instructions) {
      if (!instructions || !instructions.length) return '<p style="color:var(--text-muted);font-size:.9rem;">No instructions found.</p>';
      let html = '<ol class="instructions-list" aria-label="Instructions">';
      let stepNum = 1;
      for (const instr of instructions) {
        if (instr.startsWith('__section__')) {
          const sectionName = instr.slice('__section__'.length);
          html += `<li class="instruction-section-header" role="presentation">${esc(sectionName)}</li>`;
        } else {
          html += `
            <li class="instruction-step">
              <span class="step-number" aria-hidden="true">${stepNum}</span>
              <span class="step-text">${esc(instr)}</span>
            </li>`;
          stepNum++;
        }
      }
      html += '</ol>';
      return html;
    }

    function renderRecipe(recipe) {
      document.title = (recipe.title || 'Recipe') + ' — Mise';

      const imageHtml = recipe.image
        ? `<img src="${esc(recipe.image)}" alt="${esc(recipe.title)}" class="recipe-hero-image" loading="lazy" onerror="this.style.display='none'">`
        : '';

      const sourceHtml = recipe.url
        ? `<span class="recipe-source-link">Source: <a href="${esc(recipe.url)}" target="_blank" rel="noopener noreferrer">${esc(recipe.domain || recipe.url)}</a></span>`
        : '';

      const descHtml = recipe.description
        ? `<p class="recipe-description">${esc(recipe.description)}</p>`
        : '';

      const meta = [
        buildMetaChip('Prep Time', recipe.prepTime),
        buildMetaChip('Cook Time', recipe.cookTime),
        buildMetaChip('Total Time', recipe.totalTime),
        buildMetaChip('Servings', recipe.servings),
      ].filter(Boolean).join('');

      const metaHtml = meta ? `<div class="recipe-meta" aria-label="Recipe details">${meta}</div>` : '';

      document.getElementById('recipeContent').innerHTML = `
        ${imageHtml}
        <h1 class="recipe-title">${esc(recipe.title || 'Untitled Recipe')}</h1>
        ${sourceHtml}
        ${descHtml}
        ${metaHtml}
        <div class="recipe-body">
          <section aria-labelledby="ingredients-heading">
            <h2 class="section-heading" id="ingredients-heading">Ingredients</h2>
            ${buildIngredients(recipe.ingredients)}
          </section>
          <section aria-labelledby="instructions-heading">
            <h2 class="section-heading" id="instructions-heading">Instructions</h2>
            ${buildInstructions(recipe.instructions)}
          </section>
        </div>
      `;
    }

    /* ── Ingredient checkbox toggle ─────────────────────────────────────── */
    function toggleIngredient(index) {
      const li = document.querySelector(`.ingredient-item[data-index="${index}"]`);
      const cb = document.getElementById(`ing-${index}`);
      if (!li || !cb) return;
      cb.checked = !cb.checked;
      li.classList.toggle('checked', cb.checked);
    }

    /* ── Save recipe ────────────────────────────────────────────────────── */
    const saveBtn = document.getElementById('saveBtn');

    async function saveRecipe(recipe) {
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving…';
      try {
        const res = await fetch('/api/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ recipe }),
        });
        const data = await res.json();
        if (res.status === 409) {
          showToast('Already saved!', '');
          markSaved();
          return;
        }
        if (!res.ok) throw new Error(data.error || 'Could not save recipe.');
        showToast('Recipe saved! 🔖', 'success');
        markSaved(data.id);
      } catch (err) {
        showToast(err.message, 'error');
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Recipe';
      }
    }

    function markSaved(id) {
      saveBtn.disabled = true;
      saveBtn.textContent = '✓ Saved';
      saveBtn.className = 'btn btn-saved';
      if (id) {
        // Update recipe object and sessionStorage so re-visits know
        if (currentRecipe) {
          currentRecipe.id = id;
          sessionStorage.setItem('currentRecipe', JSON.stringify(currentRecipe));
        }
      }
    }

    /* ── Load recipe ────────────────────────────────────────────────────── */
    let currentRecipe = null;
    let viewMode = 'scrape'; // 'scrape' | 'saved'

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const savedId = params.get('id');

      if (savedId) {
        // Viewing a previously saved recipe
        viewMode = 'saved';
        document.getElementById('loadingOverlay').classList.add('visible');
        try {
          const res = await fetch(`/api/saved/${encodeURIComponent(savedId)}`);
          if (!res.ok) throw new Error('Recipe not found.');
          currentRecipe = await res.json();
        } catch (err) {
          document.getElementById('recipeContent').innerHTML = `
            <div style="text-align:center;padding:4rem 1.5rem;">
              <p style="font-size:2rem;margin-bottom:1rem;">😕</p>
              <h2 style="margin-bottom:.5rem;">Recipe not found</h2>
              <p style="color:var(--text-secondary);margin-bottom:1.5rem;">${esc(err.message)}</p>
              <a href="saved.html" class="btn btn-outline">← Back to Saved Recipes</a>
            </div>`;
          document.getElementById('loadingOverlay').classList.remove('visible');
          saveBtn.style.display = 'none';
          return;
        }
        document.getElementById('loadingOverlay').classList.remove('visible');

        // In saved mode, button becomes "Remove"
        saveBtn.textContent = '✓ Saved';
        saveBtn.className = 'btn btn-saved';
        saveBtn.disabled = false;
        saveBtn.onclick = async () => {
          if (!confirm('Remove this recipe from your saved collection?')) return;
          try {
            const res = await fetch(`/api/saved/${encodeURIComponent(savedId)}`, { method: 'DELETE' });
            if (!res.ok) throw new Error('Could not remove recipe.');
            showToast('Recipe removed.', '');
            setTimeout(() => { window.location.href = 'saved.html'; }, 1200);
          } catch (err) {
            showToast(err.message, 'error');
          }
        };
      } else {
        // Viewing a freshly scraped recipe from sessionStorage
        const stored = sessionStorage.getItem('currentRecipe');
        if (!stored) {
          window.location.href = 'index.html';
          return;
        }
        try {
          currentRecipe = JSON.parse(stored);
        } catch {
          window.location.href = 'index.html';
          return;
        }
        saveBtn.onclick = () => saveRecipe(currentRecipe);
      }

      renderRecipe(currentRecipe);
    }

    init();
  </script>
</body>
</html>
