name = "recipe-app"
main = ".open-next/worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# ─── KV namespace for saved recipes ──────────────────────────────────────────
# Before deploying, create a KV namespace and replace the ID below:
#   wrangler kv namespace create RECIPES
[[kv_namespaces]]
binding = "RECIPES"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# ─── Secrets ──────────────────────────────────────────────────────────────────
# Set your Anthropic API key as a secret (never commit it here):
#   wrangler secret put ANTHROPIC_API_KEY
